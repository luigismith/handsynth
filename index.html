<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0e2c" />
    <title>HandSynth</title>
    <meta
      name="description"
      content="Un sintetizzatore gestuale suonato con le mani via webcam."
    />
    <style>
      :root {
        color-scheme: dark;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0e2c;
        color: #cfd6ff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      /*
       * Webcam + visualizer are BOTH CSS-mirrored (selfie style). MediaPipe
       * reads the raw pixel data of the <video> element, which is unaffected
       * by CSS transforms — so MediaPipe still computes landmarks in the
       * un-mirrored frame, but they're DRAWN on a flipped canvas, which
       * lands them on top of the flipped video where the user expects to
       * see their own hand. The HandTracker already swaps MediaPipe's
       * handedness labels for the un-mirrored input, so right/left mappings
       * are correct.
       */
      #webcam {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.18;
        z-index: 1;
        pointer-events: none;
        transform: scaleX(-1);
      }
      #visualizer {
        position: absolute;
        inset: 0;
        z-index: 2;
      }
      /*
       * NOTE on mirroring: only the <video> is CSS-flipped. The HandTracker
       * x-mirrors landmarks on output, so every downstream consumer
       * (visualizer skeleton, gesture distance, palmCenter) already lives in
       * the same selfie-mirrored frame as the visible video. Flipping the
       * canvas too would double-mirror.
       */
      #ui-layer {
        position: absolute;
        inset: 0;
        z-index: 3;
        pointer-events: none;
      }
      #ui-layer > * {
        pointer-events: auto;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="visualizer"></canvas>
      <div id="ui-layer">
        <div id="onboarding"></div>
        <div id="settings-host"></div>
        <div id="terminal-host"></div>
        <div id="vibe-selector" hidden></div>
        <div id="error-overlay"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
